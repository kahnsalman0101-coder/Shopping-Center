<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- COLOR CONTROL META TAGS - Add these to prevent color changes -->
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="msapplication-navbutton-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Disable iOS automatic dark mode and color adjustments -->
    <meta name="supported-color-schemes" content="light">
    <meta name="color-adjust" content="no">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Disable browser automatic color adjustments -->
    <meta name="force-light-mode" content="yes">
    <meta name="disable-dark-mode" content="true">
    
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Apple Touch Icon and Startup Images -->
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/logo512.png">
    <meta name="apple-mobile-web-app-title" content="React App">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/logo144.png">
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml">
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="React App">
    <meta property="og:description" content="Web site created using create-react-app">
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png">
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="React App">
    <meta name="twitter:description" content="Web site created using create-react-app">
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png">

    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
